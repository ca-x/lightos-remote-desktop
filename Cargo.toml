[workspace]
members = ["crates/platform-detect", "crates/desktop-config", "crates/display-control", "crates/media-codec", "crates/stream-scheduler", "crates/media-codec-ffmpeg"]
resolver = "3"

[package]
name = "lightos-remote-desktop"
license = "PolyForm-Noncommercial-1.0.0"
version = "0.1.20"
edition = "2024"
rust-version = "1.88"
description = "A cross-platform Rust remote desktop host for browser clients"

[[bin]]
name = "lightos-remoted"
path = "src/main.rs"

[features]
portal = ["dep:ashpd", "dep:pipewire", "dep:configparser"]
rdp = ["dep:async-trait", "dep:ironrdp-server", "dep:ironrdp-pdu", "dep:rustls-pemfile", "dep:rcgen"]
bundled-jpeg = ["media-codec/bundled-jpeg", "turbojpeg/cmake", "turbojpeg/require-simd"]

[dependencies]
async-trait = { version = "0.1", optional = true }
ironrdp-server = { version = "0.13", default-features = false, optional = true }
ironrdp-pdu = { version = "0.9", optional = true }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"], optional = true }
rustls-pemfile = { version = "2", optional = true }
stream-scheduler = { path = "crates/stream-scheduler" }
media-codec = { path = "crates/media-codec" }
display-control = { path = "crates/display-control" }
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
bytes = "1"
dirs = "6"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
libc = "0.2"
memmap2 = "0.9"
opus = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmcp = { version = "=3.1.2", default-features = false, features = ["macros", "server", "transport-streamable-http-server"] }
rand = "0.9"
schemars = "1"
sha2 = "0.10"
tokio-util = "0.7"
subtle = "2"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
turbojpeg = { version = "1.5", default-features = false, features = ["pkg-config"] }
arboard = { version = "3.7", default-features = false, features = ["image-data"] }

[target.'cfg(target_os = "linux")'.dependencies]
platform-detect = { path = "crates/platform-detect" }
desktop-config = { path = "crates/desktop-config" }
libwayshot = { version = "0.9", default-features = false }
libpulse-binding = "2.30.1"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
wayland-protocols-plasma = { version = "0.3", features = ["client"] }
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "remote_desktop", "screencast", "clipboard"], optional = true }
pipewire = { version = "0.10.1", optional = true }
configparser = { version = "3.3", optional = true }
zbus = { version = "5", default-features = false, features = ["tokio"] }
xkbcommon = "0.9"
x11rb = { version = "0.14", features = ["randr", "xtest", "shm", "damage", "xfixes"] }
enigo = { version = "0.6.1", default-features = false, features = ["x11rb"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
enigo = { version = "0.6.1", default-features = false, features = ["platform_specific"] }
keycode = "1.0.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows-capture = "2.0.1"
windows-service = "0.8.1"
wasapi = "0.26"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_RemoteDesktop", "Win32_System_Environment", "Win32_System_StationsAndDesktops", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Storage_FileSystem", "Win32_System_Memory", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_System_JobObjects", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_WinRT", "Foundation_Metadata", "Graphics_Capture", "Security_Authorization_AppCapabilityAccess"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys = "0.8"
screencapturekit = { version = "11.1.0", features = ["macos_13_0"] }

[dev-dependencies]
openh264 = { version = "0.9.9", default-features = false, features = ["source"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio-tungstenite = "0.29"

[profile.release]
lto = "thin"
strip = true

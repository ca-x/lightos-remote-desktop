[workspace]
members = ["crates/platform-detect", "crates/desktop-config", "crates/display-control", "crates/media-codec", "crates/stream-scheduler", "crates/media-codec-ffmpeg"]
resolver = "3"

[package]
name = "lightos-remote-desktop"
license = "MIT"
version = "0.1.11"
edition = "2024"
rust-version = "1.88"
description = "A native Rust browser remote desktop for LightOS"

[[bin]]
name = "lightos-remoted"
path = "src/main.rs"

[features]
rdp = ["dep:async-trait", "dep:ironrdp-server", "dep:ironrdp-pdu", "dep:rustls-pemfile", "dep:rcgen"]
bundled-jpeg = ["media-codec/bundled-jpeg", "turbojpeg/cmake", "turbojpeg/require-simd"]

[dependencies]
async-trait = { version = "0.1", optional = true }
ironrdp-server = { version = "0.13", default-features = false, optional = true }
ironrdp-pdu = { version = "0.9", optional = true }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"], optional = true }
rustls-pemfile = { version = "2", optional = true }
stream-scheduler = { path = "crates/stream-scheduler" }
media-codec = { path = "crates/media-codec" }
display-control = { path = "crates/display-control" }
platform-detect = { path = "crates/platform-detect" }
desktop-config = { path = "crates/desktop-config" }
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
libc = "0.2"
libwayshot = { version = "0.9", default-features = false }
libpulse-binding = "2.30.1"
opus = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmcp = { version = "=3.1.2", default-features = false, features = ["macros", "server", "transport-streamable-http-server"] }
rand = "0.9"
schemars = "1"
sha2 = "0.10"
tokio-util = "0.7"
subtle = "2"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
turbojpeg = { version = "1.5", default-features = false, features = ["pkg-config"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
xkbcommon = "0.9"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio-tungstenite = "0.29"

[profile.release]
lto = "thin"
strip = true

name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: bash tests/aur-package.sh
      - run: bash tests/aur-codec-package.sh
  aur-native-cursor:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install matching Arch compositor headers
        run: pacman -Syu --noconfirm --needed git hyprland pkgconf
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Compile the package's cursor companion against the compositor ABI
        run: |
          set -euo pipefail
          bash scripts/build-hyprland-cursor.sh "$RUNNER_TEMP/lightos-cursor.so"
          test -s "$RUNNER_TEMP/lightos-cursor.so"
          readelf -h "$RUNNER_TEMP/lightos-cursor.so" | grep -q 'DYN (Shared object file)'
  test:
    runs-on: ubuntu-latest
    env:
      TURBOJPEG_SOURCE: vendor
      TURBOJPEG_STATIC: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Native and RDP test dependencies
        run: |
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libpulse-dev libpipewire-0.3-dev libspa-0.2-dev libclang-dev cmake nasm pkg-config ffmpeg xvfb xauth libxtst6 python3 openssl dbus
          if apt-cache show freerdp3-x11 >/dev/null 2>&1; then
            sudo apt-get install -y freerdp3-x11
          else
            sudo apt-get install -y freerdp2-x11
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: cargo fmt --all --check
      - name: Test workspace including MCP HTTP, authorization and input cleanup
        run: cargo test --workspace --locked --features bundled-jpeg
      - run: cargo clippy --workspace --locked --features bundled-jpeg --all-targets -- -D warnings
      - run: cargo test --workspace --locked --features bundled-jpeg,rdp,portal
      - run: cargo clippy --workspace --locked --features bundled-jpeg,rdp,portal --all-targets -- -D warnings
      - name: FreeRDP interoperability on a private Xvfb display
        run: |
          rdp_client=$(command -v xfreerdp3 || command -v xfreerdp)
          rdp_xvfb=$(command -v Xvfb)
          LRD_TEST_FREERDP="$rdp_client" LRD_TEST_XVFB="$rdp_xvfb" cargo test --locked --features bundled-jpeg,rdp,portal freerdp_tcp_tls_bitmap_input_resize_reconnect_and_denials -- --ignored --nocapture
      - name: X11 capture, input and clipboard on private authenticated displays
        run: |
          LRD_TEST_CARGO_FEATURES=bundled-jpeg,rdp,portal LRD_TEST_XVFB="$(command -v Xvfb)" LRD_TEST_X11_WORKER="$PWD/target/debug/lightos-remoted" bash tests/x11-backend.sh
          LRD_TEST_X11_DISABLE_ACCELERATION=1 LRD_TEST_CARGO_FEATURES=bundled-jpeg,rdp,portal LRD_TEST_XVFB="$(command -v Xvfb)" LRD_TEST_X11_WORKER="$PWD/target/debug/lightos-remoted" bash tests/x11-backend.sh
      - name: AUR bootstrap, recovery and published-release guards
        run: |
          bash tests/aur-bootstrap.sh
          bash tests/aur-release.sh
          bash tests/aur-codec-package.sh
          LRD_AUR_EXPORT_BINARY="$PWD/target/debug/lightos-remoted" bash tests/aur-package.sh
      - run: bash tests/installer.sh
      - run: bash scripts/test-install-compat.sh
  build:
    needs: test
    runs-on: ubuntu-22.04
    env:
      TURBOJPEG_SOURCE: vendor
      TURBOJPEG_STATIC: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build dependencies
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev libpulse-dev libpipewire-0.3-dev libspa-0.2-dev libclang-dev cmake nasm pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Prepare pinned SPA headers while retaining the Ubuntu 22.04 PipeWire ABI
        run: bash .github/scripts/prepare-spa-build-sdk.sh "$RUNNER_TEMP/lrd-spa-sdk"
      - run: cargo build --release --locked --features bundled-jpeg,rdp,portal
      - name: Package Linux x86_64 binary
        shell: bash
        run: |
          set -euo pipefail
          package=lightos-remoted-linux-x86_64
          mkdir -p "dist/$package/licenses"
          cp target/release/lightos-remoted README.md README.en.md LICENSE "dist/$package/"
          cp docs/licenses/lightos-remote-desktop-mit.txt "dist/$package/licenses/lightos-remote-desktop-mit.txt"
          cp -r docs "dist/$package/"
          registry="${CARGO_HOME:-$HOME/.cargo}/registry/src"
          jpeg_license=$(find "$registry" -path '*/turbojpeg-sys-1.2.0/libjpeg-turbo/LICENSE.md' -print -quit)
          wrapper_license=$(find "$registry" -path '*/turbojpeg-1.5.1/LICENSE' -print -quit)
          test -s "$jpeg_license" && test -s "$wrapper_license"
          cp "$jpeg_license" "dist/$package/licenses/libjpeg-turbo.md"
          cp "$wrapper_license" "dist/$package/licenses/turbojpeg.txt"
          cp web/dist/NOTICE.frontend.txt "dist/$package/licenses/frontend.txt"
          cp "$RUNNER_TEMP/lrd-spa-sdk/header-notices.txt" "dist/$package/licenses/pipewire-spa-sdk.txt"
          cp "$RUNNER_TEMP/lrd-spa-sdk/build-sdk.txt" "dist/$package/build-sdk.txt"
          python3 scripts/mcp-notices.py "dist/$package/licenses/protocol-dependencies.txt"
          openh264_license=$(find "$registry" -path '*/openh264-sys2-*/upstream/LICENSE' -print -quit)
          openh264_wrapper_notice=$(find "$registry" -path '*/openh264-0.9.9/README.md' -print -quit)
          test -s "$openh264_license" && test -s "$openh264_wrapper_notice"
          cp "$openh264_license" "dist/$package/licenses/openh264.txt"
          cp "$openh264_wrapper_notice" "dist/$package/licenses/openh264-rust-README.md"
          cp docs/licenses/openh264-rust.txt "dist/$package/licenses/openh264-rust.txt"
          opus_license=$(find "$registry" -path '*/opusic-sys-0.7.5/opus/COPYING' -print -quit)
          opus_binding_license=$(find "$registry" -path '*/opusic-sys-0.7.5/LICENSE' -print -quit)
          opus_wrapper_license=$(find "$registry" -path '*/opus-0.4.0/LICENSE-MIT' -print -quit)
          test -s "$opus_license" && test -s "$opus_binding_license" && test -s "$opus_wrapper_license"
          cp "$opus_license" "dist/$package/licenses/opus.txt"
          cp "$opus_binding_license" "dist/$package/licenses/opusic-sys.txt"
          cp "$opus_wrapper_license" "dist/$package/licenses/opus-rust.txt"
          ldd "dist/$package/lightos-remoted" | tee "dist/$package/dependencies.txt"
          if grep -q 'libturbojpeg\|not found' "dist/$package/dependencies.txt"; then exit 1; fi
          if readelf -d "dist/$package/lightos-remoted" | grep -q 'NEEDED.*libopus'; then exit 1; fi
          if readelf -d "dist/$package/lightos-remoted" | grep -Eq 'NEEDED.*lib(avcodec|avformat|avutil|swscale)'; then exit 1; fi
          "dist/$package/lightos-remoted" --help
          tar -C dist -czf "dist/$package.tar.gz" "$package"
          (cd dist && sha256sum "$package.tar.gz" > "$package.tar.gz.sha256")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lightos-remoted-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
  native-codec:
    runs-on: ubuntu-24.04
    env:
      TURBOJPEG_SOURCE: vendor
      TURBOJPEG_STATIC: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Native FFmpeg and binding dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          pkg-config clang libclang-dev cmake nasm
          libavcodec-dev libavformat-dev libavutil-dev libswscale-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Test actual native encoding, conversion and decoding
        run: cargo test -p media-codec-ffmpeg --locked --features native,media-codec/bundled-jpeg
      - name: Check native worker
        run: cargo clippy -p media-codec-ffmpeg --locked --features native,media-codec/bundled-jpeg --all-targets -- -D warnings
      - name: Build optional worker
        run: cargo build -p media-codec-ffmpeg --release --locked --features native,media-codec/bundled-jpeg
      - name: Package ABI-specific optional worker
        shell: bash
        run: |
          set -euo pipefail
          package=lightos-codec-ffmpeg-linux-x86_64-ubuntu-24.04
          mkdir -p "dist/$package/licenses"
          cp target/release/lightos-codec-ffmpeg LICENSE "dist/$package/"
          cp docs/licenses/lightos-remote-desktop-mit.txt "dist/$package/licenses/lightos-remote-desktop-mit.txt"
          cp docs/hardware-encoding.md "dist/$package/README.md"
          registry="${CARGO_HOME:-$HOME/.cargo}/registry/src"
          wrapper_license=$(find "$registry" -path '*/ffmpeg-next-9.0.0/LICENSE' -print -quit)
          test -s "$wrapper_license"
          cp "$wrapper_license" "dist/$package/licenses/ffmpeg-next.txt"
          cp docs/licenses/ffmpeg-runtime.txt "dist/$package/licenses/ffmpeg-runtime.txt"
          ldd "dist/$package/lightos-codec-ffmpeg" | tee "dist/$package/dependencies.txt"
          if grep -q 'not found' "dist/$package/dependencies.txt"; then exit 1; fi
          pkg-config --modversion libavcodec libavformat libavutil libswscale > "dist/$package/ffmpeg-abi.txt"
          tar -C dist -czf "dist/$package.tar.gz" "$package"
          (cd dist && sha256sum "$package.tar.gz" > "$package.tar.gz.sha256")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lightos-codec-ffmpeg-linux-x86_64-ubuntu-24.04
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
  native-host:
    name: Native host (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rustflags: '-C target-feature=+crt-static'
          - os: macos-15
            target: aarch64-apple-darwin
            rustflags: ''
          - os: macos-15-intel
            target: x86_64-apple-darwin
            rustflags: ''
    env:
      TURBOJPEG_SOURCE: vendor
      TURBOJPEG_STATIC: '1'
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      EXPECTED_TARGET: ${{ matrix.target }}
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Verify the runner uses the requested native architecture
        shell: bash
        run: |
          python -c 'import os, subprocess; host = next(line[6:] for line in subprocess.check_output(["rustc", "-vV"], text=True).splitlines() if line.startswith("host: ")); print("Native Rust host:", host); assert host == os.environ["EXPECTED_TARGET"], "unexpected runner architecture"'
      - name: Windows SIMD build dependency
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm --no-progress -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content $env:GITHUB_PATH 'C:\Program Files\NASM'
      - name: macOS SIMD build dependency
        if: runner.os == 'macOS'
        run: brew list nasm >/dev/null 2>&1 || brew install nasm
      - name: Select the macOS SDK required by native Swift dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          native_xcode_dir=/Applications/Xcode_26.3.app/Contents/Developer
          test -d "$native_xcode_dir"
          echo "DEVELOPER_DIR=$native_xcode_dir" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$native_xcode_dir" xcrun --sdk macosx --show-sdk-version
      - run: npm ci
      - run: npm run build
      - name: Native contracts, storage and installer unit tests
        run: cargo test --locked -p lightos-remote-desktop --target ${{ matrix.target }} --features bundled-jpeg --lib
      - name: Native host lint
        run: cargo clippy --locked -p lightos-remote-desktop --target ${{ matrix.target }} --features bundled-jpeg --all-targets -- -D warnings
      - name: Optional RDP remains buildable and physical desktop restricted
        run: cargo check --locked -p lightos-remote-desktop --target ${{ matrix.target }} --features bundled-jpeg,rdp
      - name: Build native host
        run: cargo build --release --locked -p lightos-remote-desktop --target ${{ matrix.target }} --features bundled-jpeg
      - name: CLI smoke test
        shell: bash
        run: |
          binary=./target/$EXPECTED_TARGET/release/lightos-remoted
          if [[ "$RUNNER_OS" == Windows ]]; then binary+=.exe; fi
          "$binary" --version
      - name: Verify the Windows package has no external Visual C++ runtime dependency
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products '*' -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin was not found' }
          $imports = & $dumpbin /dependents "target\$env:EXPECTED_TARGET\release\lightos-remoted.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $imports | Write-Output
          if ($imports -match '(?i)(vcruntime|msvcp|concrt)\d+.*\.dll') { throw 'Visual C++ runtime must be linked statically' }
      - name: Package native host and notices
        shell: bash
        run: |
          target=$(rustc -vV | sed -n 's/^host: //p')
          python scripts/mcp-notices.py dist/native-runtime-notices.txt --target "$target" --features bundled-jpeg
          python scripts/package-native-host.py --target "$target" --notices dist/native-runtime-notices.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lightos-remoted-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, native-codec, native-host]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: lightos-*
          merge-multiple: true
          path: dist
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes
          fi
      - name: Build Arch worker before publishing AUR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # GITHUB_TOKEN release events do not start another workflow.
          if [[ $(gh release view "$RELEASE_TAG" --json isDraft,isPrerelease --jq '.isDraft == false and .isPrerelease == false') == true ]]; then
            gh workflow run arch-codec.yml --ref main -f "version=$RELEASE_TAG" -f dispatch_aur=true
          fi

name: Publish AUR
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Published stable release tag (vX.Y.Z)
        required: true
        type: string
      force:
        description: Republish the same version
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: aur-lightos-remoted-bin
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify published release and prepare metadata
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.version || github.event.release.tag_name }}
          FORCE_RELEASE: ${{ inputs.force || false }}
        run: bash .github/scripts/prepare-aur-release.sh
      - name: Publish checksummed package to AUR
        if: steps.release.outputs.publish == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@da03e160361ce01bf087e790b6ffd196d7dccff7 # v4.1.3
        with:
          pkgname: lightos-remoted-bin
          pkgbuild: ./lightos-remoted-bin/PKGBUILD
          updpkgsums: true
          assets: |
            ./lightos-remoted-bin/lightos-remoted-bin.install
            ./lightos-remoted-bin/aquamarine-wayland.patch
          post_process: bash /github/workspace/.github/scripts/prune-lightos-aur.sh
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update to version ${{ steps.release.outputs.version }}
          ssh_keyscan_types: rsa,ecdsa,ed25519

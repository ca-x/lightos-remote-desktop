name: Publish AUR
on:
  workflow_dispatch:
    inputs:
      version:
        description: Published stable release tag (vX.Y.Z)
        required: true
        type: string
      force:
        description: Republish packages already at the same version and pkgrel
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: aur-lightos-remoted-bin
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.release.outputs.version }}
      publish: ${{ steps.release.outputs.publish }}
      publish_helper: ${{ steps.release.outputs.publish_helper }}
      pkgrel: ${{ steps.release.outputs.pkgrel }}
      pkgrel_helper: ${{ steps.release.outputs.pkgrel_helper }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify published release, exact tag CI and both AUR versions
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.version }}
          FORCE_RELEASE: ${{ inputs.force || false }}
        run: bash .github/scripts/prepare-aur-release.sh
  helper:
    needs: prepare
    if: needs.prepare.outputs.publish_helper == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Apply verified helper metadata
        env:
          AUR_VERSION: ${{ needs.prepare.outputs.version }}
          AUR_PKGREL: ${{ needs.prepare.outputs.pkgrel_helper }}
        run: sed -i "s/^pkgver=.*/pkgver=$AUR_VERSION/; s/^pkgrel=.*/pkgrel=$AUR_PKGREL/" lightos-codec-ffmpeg-bin/PKGBUILD
      - name: Publish optional native FFmpeg worker first
        uses: KSXGitHub/github-actions-deploy-aur@da03e160361ce01bf087e790b6ffd196d7dccff7 # v4.1.3
        with:
          pkgname: lightos-codec-ffmpeg-bin
          pkgbuild: ./lightos-codec-ffmpeg-bin/PKGBUILD
          updpkgsums: true
          assets: |
            ./lightos-codec-ffmpeg-bin/lightos-codec-ffmpeg-bin.install
            ./lightos-codec-ffmpeg-bin/validate-arch-codec.py
          post_process: bash /github/workspace/.github/scripts/prune-lightos-aur.sh lightos-codec-ffmpeg-bin
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update to version ${{ needs.prepare.outputs.version }}
          ssh_keyscan_types: rsa,ecdsa,ed25519
  publish:
    needs: [prepare, helper]
    if: >-
      always() && needs.prepare.result == 'success' &&
      (needs.helper.result == 'success' || needs.helper.result == 'skipped') &&
      needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Apply verified main package metadata
        env:
          AUR_VERSION: ${{ needs.prepare.outputs.version }}
          AUR_PKGREL: ${{ needs.prepare.outputs.pkgrel }}
        run: sed -i "s/^pkgver=.*/pkgver=$AUR_VERSION/; s/^pkgrel=.*/pkgrel=$AUR_PKGREL/" lightos-remoted-bin/PKGBUILD
      - name: Publish desktop with its optional helper available
        uses: KSXGitHub/github-actions-deploy-aur@da03e160361ce01bf087e790b6ffd196d7dccff7 # v4.1.3
        with:
          pkgname: lightos-remoted-bin
          pkgbuild: ./lightos-remoted-bin/PKGBUILD
          updpkgsums: true
          assets: |
            ./lightos-remoted-bin/lightos-remoted-bin.install
            ./lightos-remoted-bin/aquamarine-wayland.patch
          post_process: bash /github/workspace/.github/scripts/prune-lightos-aur.sh lightos-remoted-bin
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update to version ${{ needs.prepare.outputs.version }}
          ssh_keyscan_types: rsa,ecdsa,ed25519

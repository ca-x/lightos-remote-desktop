[package]
name = "display-control"
license = "MIT"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
anyhow = "1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["net", "io-util", "time", "rt", "process", "sync"] }



[target.'cfg(target_os = "linux")'.dependencies]
libwayshot = { version = "0.9", default-features = false }
serde_json = "1"
wayland-client = "0.31"
zbus = { version = "5", default-features = false, features = ["tokio"] }
hex = "0.4"
x11rb = "0.14"
x11rb-async = { version = "0.14", features = ["randr"] }
x11rb-protocol = { version = "0.14", features = ["randr"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

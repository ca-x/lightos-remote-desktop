[package]
name = "media-codec"
license = "PolyForm-Noncommercial-1.0.0"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[features]
bundled-jpeg = ["turbojpeg/cmake", "turbojpeg/require-simd"]

[dependencies]
anyhow = "1"
bincode = { version = "2", features = ["serde"] }
bytes = "1"
fast_image_resize = { version = "6.1", features = ["only_u8x4"] }
futures-util = { version = "0.3", features = ["sink"] }
openh264 = { version = "0.9.9", default-features = false, features = ["source"] }
openh264-sys2 = { version = "0.9.9", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
tokio = { version = "1", features = ["sync", "time", "rt", "process", "io-util"] }
tokio-util = { version = "0.7", features = ["codec"] }
turbojpeg = { version = "1.5", default-features = false, features = ["pkg-config"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
memmap2 = "0.9"

[dev-dependencies]
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="lzcapp-navigation-bar-scheme" content="hidden" />
  <meta name="lzcapp-disable-dark" content="true" />
  <meta name="theme-color" content="#f5f5f5" />
  <script src="./shell.js"></script>
  <title>懒猫远程</title>
  <link rel="icon" type="image/png" href="./icon.png" />
  <link rel="stylesheet" href="./style.css" />
  <script src="./manager.js" defer></script>
</head>
<body>
  <main>
    <header>
      <div class="brand"><img src="./icon.png" width="44" height="44" alt="" /><div><h1 data-text="title">懒猫远程</h1><p class="brand-caption" data-text="subtitle">远程设备</p></div></div>
      <div class="header-actions"><button id="theme-toggle" class="icon-button" type="button" aria-label="切换主题"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4v16a8 8 0 0 0 0-16Z" fill="currentColor" stroke="none"/></svg></button><button id="refresh" class="refresh" type="button" data-text="refresh">刷新设备</button></div>
    </header>
    <div class="section-heading"><h2 data-text="devices">我的设备</h2><p id="status" role="status" aria-live="polite"></p></div>
    <p id="warning" role="alert" hidden></p>
    <section id="desktops" aria-label="Remote devices"></section>
    <section id="empty" hidden><div class="empty-icon" aria-hidden="true">▣</div><h2 data-text="empty">暂无设备</h2><p data-text="help">在电脑上运行懒猫远程，即可在这里管理。</p></section>
    <footer data-text="footnote">桌面仅在开启后运行，系统权限由设备本机确认。</footer>
  </main>
</body>
</html>

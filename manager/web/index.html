<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>远程桌面</title>
    <link rel="icon" type="image/png" href="./icon.png" />
    <link rel="stylesheet" href="./style.css" />
    <script src="./manager.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <div class="title"><img src="./icon.png" width="48" height="48" alt="" /><div><h1 data-text="title">远程桌面</h1><p class="subtitle" data-text="subtitle">选择一台设备，开始连接。</p></div></div>
        <button id="refresh" type="button" data-text="refresh">刷新</button>
      </header>
      <p id="status" role="status" aria-live="polite"></p>
      <p id="warning" role="alert" hidden></p>
      <section id="desktops" aria-label="Remote desktops"></section>
      <section id="empty" hidden><div class="empty-icon" aria-hidden="true">▣</div><h2 data-text="empty">暂无可连接的远程桌面</h2><p data-text="help">请确认设备在线，并已开启远程桌面。</p></section>
    </main>
  </body>
</html>

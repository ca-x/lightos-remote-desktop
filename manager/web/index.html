<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="lzcapp-navigation-bar-scheme" content="hidden" />
  <meta name="lzcapp-disable-dark" content="true" />
  <meta name="theme-color" content="#f5f5f5" />
  <script src="./shell.js"></script>
  <title>懒猫远程</title>
  <link rel="icon" type="image/png" href="./icon.png" />
  <link rel="stylesheet" href="./style.css" />
  <script src="./manager.js" defer></script>
</head>
<body>
  <main>
    <header>
      <div class="brand"><img src="./icon.png" width="44" height="44" alt="" /><div><h1 data-text="title">懒猫远程</h1><p class="brand-caption" data-text="subtitle">懒猫微服网络保障您的隐私和数据安全。</p></div></div>
      <div class="header-actions"><button id="theme-toggle" class="icon-button" type="button" aria-label="切换主题"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4v16a8 8 0 0 0 0-16Z" fill="currentColor" stroke="none"/></svg></button></div>
    </header>
    <div class="section-heading"><h2 data-text="devices">在线设备</h2><p id="status" role="status" aria-live="polite"></p></div>
    <p id="warning" role="alert" hidden></p>
    <section id="desktops" aria-label="Remote devices"></section>
    <section id="empty" hidden><div class="empty-icon" aria-hidden="true">▣</div><h2 data-text="empty">暂无设备</h2><p data-text="help">在电脑上登录懒猫微服客户端，即可在这里管理。</p></section>
    <div class="section-heading offline-heading"><h2 data-text="offlineDevices">离线设备</h2><p id="offline-status" role="status" aria-live="polite"></p></div>
    <section id="offline-desktops" aria-label="Offline devices"></section>
    <p id="offline-empty" data-text="offlineEmpty">暂无离线设备</p>
    <footer data-text="footnote">桌面仅在开启后运行，系统权限由设备本机确认。</footer>
  </main>
  <dialog id="update-confirmation" aria-labelledby="update-title" aria-describedby="update-message">
    <form method="dialog">
      <h2 id="update-title" data-text="update">更新远程桌面</h2>
      <p id="update-message" data-text="interruptNotice">更新会中断当前远程桌面连接。确认后将自动关闭服务并更新，完成后恢复服务。</p>
      <div class="dialog-actions"><button value="cancel" data-text="cancel" autofocus>取消</button><button value="confirm" class="confirm-update" data-text="confirm">确认</button></div>
    </form>
  </dialog>
</body>
</html>

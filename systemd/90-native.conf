[Unit]
Description=LightOS Native Rust Remote Desktop

[Service]
ExecStart=
ExecStart=/usr/local/lib/lightos-remote-desktop/current/lightos-remote-desktop serve
EnvironmentFile=/etc/lightos/remote-desktop.env
EnvironmentFile=-/etc/lightos/remote-desktop-native.env
Environment=XDG_RUNTIME_DIR=/run/lightos-remote-desktop
